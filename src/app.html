<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>ZeroOne Agents Tools</title>
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
		<script>
			(function() {
				try {
					var theme = localStorage.getItem('theme');
					if (theme === 'light') {
						document.documentElement.classList.remove('dark');
					} else if (!theme && window.matchMedia('(prefers-color-scheme: light)').matches) {
						document.documentElement.classList.remove('dark');
					}
				} catch(e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-50">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
