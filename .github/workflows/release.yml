name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils file

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: 'true'
          APPIMAGE_EXTRACT_AND_RUN: '1'
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ZeroOne Agents Tools ${{ github.ref_name }}'
          releaseBody: |
            ## Download & Install

            | Platform | Installer | Notes |
            |----------|-----------|-------|
            | **Windows (x64)** | `.exe` (NSIS Setup) or `.msi` | Run installer directly on Windows 10/11 |
            | **Linux (Debian/Ubuntu/Mint/Pop!_OS)** | `.deb` | `sudo apt install ./ZeroOne*.deb` |
            | **Linux (Universal)** | `.AppImage` | `chmod +x ZeroOne*.AppImage && ./ZeroOne*.AppImage` |
            | **Linux (Fedora/RHEL)** | `.rpm` | `sudo dnf install ./ZeroOne*.rpm` |
            | **macOS (Apple Silicon / Intel)** | `.dmg` | Unsigned `.dmg` (`xattr -cr "/Applications/ZeroOne Agents Tools.app"` if Gatekeeper prompts) |

            ## What's Changed

            See the [commit history](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}) for details.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
